
yaml
name: Fabriquer l'APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Décompresser le projet
        run: unzip -o -q hopla-scan-projet.zip

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dépendances
        run: npm ci

      - name: Copier l'application web dans le projet Android
        run: npx cap sync android

      - name: Compiler l'APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../hopla-scan.apk

      - name: Garder l'APK dans les fichiers de la compilation
        uses: actions/upload-artifact@v4
        with:
          name: hopla-scan-apk
          path: hopla-scan.apk

      - name: Publier l'APK (lien de téléchargement direct)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Hopla Scan — version ${{ github.run_number }}
          body: Ouvrez ce lien sur votre téléphone Android, téléchargez hopla-scan.apk puis installez-le.
          files: hopla-scan.apk
          make_latest: true
